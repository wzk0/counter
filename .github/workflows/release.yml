name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform
        run: sdkmanager --install "platforms;android-36" > /dev/null

      - name: Restore signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > counter-release.jks
          cat > keystore.properties <<EOF
          storeFile=counter-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 counter-release.jks keystore.properties

      - name: Build release APK
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "Counter-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Counter-${VERSION}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Counter-*.apk
          generate_release_notes: true